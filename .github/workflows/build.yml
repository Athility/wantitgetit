name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore StreamDesk.sln

      - name: Build
        run: dotnet build StreamDesk.sln -c Release --no-restore

      - name: Test
        run: dotnet test StreamDesk.sln -c Release --no-build --logger "trx" --results-directory "test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/**/*.trx
          if-no-files-found: warn

      - name: Publish self-contained Windows x64
        run: dotnet publish src/StreamDesk.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamDesk-Windows-x64
          path: publish/
          if-no-files-found: error
